<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickNotes - Simple Note Taking</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header>
    <div class="container">
      <h1>QuickNotes</h1>
      <p>Capture your thoughts, tasks and ideas in seconds.</p>
    </div>
  </header>

  <main class="container">
    <section aria-labelledby="add-note-heading">
      <h2 id="add-note-heading">Add a note</h2>
      <form id="note-form">
        <div class="form-group">
          <label for="note-input">Your note</label>
          <input type="text" id="note-input" name="note" maxlength="200" placeholder="Write something..." autocomplete="off">
        </div>

        <div class="form-group">
          <label for="note-category">Category</label>
          <select id="note-category" name="category">
            <option value="Personal">Personal</option>
            <option value="Work">Work</option>
            <option value="Study">Study</option>
          </select>
        </div>

        <button type="submit">Add Note</button>
      </form>
      <p id="error-message" role="alert" aria-live="polite"></p>
    </section>

    <section aria-labelledby="your-notes-heading">
      <h2 id="your-notes-heading">Your notes</h2>
      <label class="search-label" for="search-input">Search your notes</label>
      <input type="search" id="search-input" placeholder="Search by note text..." autocomplete="off">
      <p id="note-count" aria-live="polite">You have no notes yet.</p>
      <ul id="notes-list" aria-live="polite"></ul>
    </section>
  </main>

  <footer>
    <div class="container">
      <p>&copy; 2026 QuickNotes. Built with HTML, CSS and JavaScript.</p>
    </div>
  </footer>
</body>
</html>
